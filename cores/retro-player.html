<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Web Emu · Classic Consoles</title>
<style>
:root{color-scheme:dark;background:#080507;color:#fff;font-family:system-ui,sans-serif}
*{box-sizing:border-box}
html,body,#game{width:100%;height:100%;margin:0;overflow:hidden}
#status{position:absolute;inset:0;display:grid;place-items:center;padding:20px;background:#10080e;color:#e8c5cd;text-align:center}
#status[hidden]{display:none}
</style>
</head>
<body>
<div id="game"></div><div id="status" role="status">Waiting for a game…</div>
<script>
"use strict";
const systems = {
  nds: ["desmume", ["nds"]],
  nes: ["fceumm", ["nes"]],
  snes: ["snes9x", ["sfc", "smc"]],
  n64: ["mupen64plus_next", ["n64", "z64", "v64"]],
  segaMD: ["genesis_plus_gx", ["md", "gen", "bin"]],
  segaGG: ["genesis_plus_gx", ["gg"]],
  segaMS: ["genesis_plus_gx", ["sms"]],
  atari2600: ["stella2014", ["a26", "bin"]],
  vb: ["beetle_vb", ["vb"]]
};
let session = null, started = false;
const status = document.getElementById("status");
const origin = location.origin;
function tell(type, message) {
  if (session) parent.postMessage({ emulator: "webemu-retro", session, type, message }, origin);
}
window.addEventListener("error", event => {
  if (started) tell("error", event.message || "Emulator script failed.");
});
window.addEventListener("unhandledrejection", event => {
  if (started) tell("error", event.reason?.message || String(event.reason));
});
window.addEventListener("message", event => {
  if (event.source !== parent || event.origin !== origin || event.data?.emulator !== "webemu-retro") return;
  const data = event.data;
  if (data.type === "stop" && data.session === session) {
    try { window.EJS_emulator?.gameManager?.saveSaveFiles?.(); } catch (_) {}
    try { window.EJS_emulator?.pause?.(); } catch (_) {}
    return;
  }
  if (data.type !== "start" || started) return;
  session = data.session;
  const config = systems[data.system];
  if (!config || !(data.file instanceof File) || !data.file.size ||
      !config[1].some(ext => data.file.name.toLowerCase().endsWith("." + ext))) {
    tell("error", "Invalid game file or unsupported console.");
    return;
  }
  started = true;
  status.textContent = "Starting " + data.system + " core…";
  let hash = 0;
  const fingerprint = data.file.name.toLowerCase() + ":" + data.file.size;
  for (const char of fingerprint) hash = (Math.imul(hash, 31) + char.charCodeAt(0)) | 0;
  window.EJS_player = "#game";
  window.EJS_core = data.system;
  window.EJS_gameUrl = data.file;
  window.EJS_gameName = data.file.name.replace(/\.[^.]+$/, "");
  window.EJS_gameID = hash >>> 0;
  window.EJS_pathtodata = new URL("../vendor/emulatorjs/data/", location.href).href;
  window.EJS_startOnLoaded = true;
  window.EJS_color = "#a31936";
  window.EJS_volume = 0.75;
  window.EJS_ready = () => { status.hidden = true; tell("ready", ""); };
  window.EJS_onGameStart = () => { status.hidden = true; tell("playing", ""); };
  window.EJS_onExit = () => tell("status", "Game exited.");
  const script = document.createElement("script");
  script.src = window.EJS_pathtodata + "loader.js";
  script.onerror = () => tell("error", "Bundled EmulatorJS loader missing.");
  document.head.appendChild(script);
});
</script>
</body>
</html>
