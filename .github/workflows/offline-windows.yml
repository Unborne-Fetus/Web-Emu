name: Build Offline Web Emu

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: offline-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline-windows:
    name: Offline Windows (32 console variants)
    runs-on: ubuntu-latest
    steps:
      - name: Check out Web Emu
        uses: actions/checkout@v4

      - name: Set up Node.js for build
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build offline Game Boy mGBA runtime
        run: |
          set -euo pipefail
          git clone --depth 1 --branch v0.1.1 https://github.com/wasm-gaming/mGBA-wasm.git upstream || git clone --depth 1 https://github.com/wasm-gaming/mGBA-wasm.git upstream
          python3 scripts/patch-mgba-speed.py
          npm install --no-save --no-package-lock esbuild@0.25.12 @wasm-gaming/engine-specs@0.2.6
          mkdir -p vendor
          ./node_modules/.bin/esbuild upstream/src/mgba.sdk.ts --bundle --format=esm --platform=browser --target=es2022 --outfile=vendor/mgba-sdk.js
          curl -fLsS --retry 3 https://cdn.jsdelivr.net/npm/@wasm-gaming/mgba-wasm@0.1.1/dist/mgba/mgba.js -o vendor/mgba.js
          curl -fLsS --retry 3 https://cdn.jsdelivr.net/npm/@wasm-gaming/mgba-wasm@0.1.1/dist/mgba/mgba.wasm -o vendor/mgba.wasm
          test -s vendor/mgba-sdk.js
          test -s vendor/mgba.js
          test -s vendor/mgba.wasm

      - name: Download Azahar and all 24 retro libretro cores
        run: python3 scripts/fetch-emulatorjs-azahar.py

      - name: Verify all 32 supported console variants
        run: python3 scripts/verify-3ds-assets.py

      - name: Assemble offline package
        run: |
          set -euo pipefail
          python3 scripts/build-offline-folder.py
          package=dist-offline-complete/Web-Emu-Offline
          mkdir -p "$package/runtime"
          version=v22.16.0
          curl -fLsS --retry 3 "https://nodejs.org/dist/$version/node-$version-win-x64.zip" -o /tmp/node-win-x64.zip
          unzip -p /tmp/node-win-x64.zip "node-$version-win-x64/node.exe" > "$package/runtime/node.exe"
          unzip -p /tmp/node-win-x64.zip "node-$version-win-x64/LICENSE" > "$package/runtime/NODE-LICENSE.txt"
          python3 scripts/verify-offline-folder.py "$package"

      - name: Test offline server and every bundled console
        run: |
          set -euo pipefail
          WEB_EMU_NO_BROWSER=1 node dist-offline-complete/Web-Emu-Offline/scripts/offline-server.cjs >/tmp/web-emu-server.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          for n in $(seq 1 30); do
            if curl -fsSI http://127.0.0.1:8765/ >/tmp/web-emu-headers; then break; fi
            sleep 1
          done
          grep -qi 'cross-origin-opener-policy: same-origin' /tmp/web-emu-headers
          grep -qi 'cross-origin-embedder-policy: require-corp' /tmp/web-emu-headers
          curl -fsSI http://127.0.0.1:8765/cores/3ds-player.html
          curl -fsSI http://127.0.0.1:8765/vendor/emulatorjs/data/cores/azahar-thread-wasm.data
          curl -fsSI http://127.0.0.1:8765/vendor/mgba.wasm
          curl -fsSI http://127.0.0.1:8765/cores/retro-player.html
          curl -fsSI http://127.0.0.1:8765/cores/retro-systems.json
          curl -fsSI http://127.0.0.1:8765/vendor/emulatorjs/data/cores/ppsspp-assets.zip
          python3 - <<'PY'
          from pathlib import Path
          import json, urllib.request
          package=Path("dist-offline-complete/Web-Emu-Offline")
          variants=json.loads((package/"vendor/emulatorjs/data/cores/webemu-variants.json").read_text())
          catalog=json.loads((package/"cores/retro-systems.json").read_text())["systems"]
          assert len(catalog) == 27
          for core, info in variants.items():
              if core == "azahar": continue
              if not info["webgl2"] and not info["legacy"]:
                  raise SystemExit("No bundled WASM core: "+core)
              prefix=core+("-thread" if info["threads"] else "")
              suffix="-wasm.data" if info["webgl2"] else "-legacy-wasm.data"
              url="http://127.0.0.1:8765/vendor/emulatorjs/data/cores/"+prefix+suffix
              request=urllib.request.Request(url, method="HEAD")
              with urllib.request.urlopen(request,timeout=5) as response:
                  if response.status != 200: raise SystemExit("Missing offline core: "+url)
          print("PASS: Every configured console core is served from localhost, not the internet.")
          PY
          echo 'All 32 console variants configured; local WASM access and COOP/COEP headers verified'

      - name: Upload ready-to-extract Windows offline ZIP
        uses: actions/upload-artifact@v4
        with:
          name: Web-Emu-Offline-All-Systems
          path: dist-offline-complete/Web-Emu-Offline/
          if-no-files-found: error
          compression-level: 6
