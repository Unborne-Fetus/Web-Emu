name: 3DS WebAssembly Port Feasibility
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  wasm-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Get Azahar source
        run: |
          git clone --depth 1 --recurse-submodules --shallow-submodules --jobs 8 https://github.com/azahar-emu/azahar.git azahar-src
          git -C azahar-src submodule status --recursive > azahar-submodules.txt
          git -C azahar-src rev-parse HEAD | tee azahar-revision.txt
      - name: Install Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: '4.0.17'
      - name: Prepare bundled robin-map fallback
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          root = Path('azahar-src')
          cmake = root / 'CMakeLists.txt'
          text = cmake.read_text()
          anchor = 'find_package(tsl-robin-map QUIET)'
          headers = list((root / 'externals').rglob('robin_map.h'))
          print('Bundled robin_map.h candidates:', [str(h) for h in headers])
          if anchor not in text:
              raise SystemExit('Azahar CMake robin-map declaration changed')
          if not headers:
              raise SystemExit('No bundled robin-map headers found; investigate upstream dependency')
          include_dir = headers[0].parent.parent.resolve().as_posix()
          fallback = """
          if(NOT TARGET tsl::robin_map)
              add_library(tsl::robin_map INTERFACE IMPORTED)
              set_target_properties(tsl::robin_map PROPERTIES
                  INTERFACE_INCLUDE_DIRECTORIES "INCLUDE_DIRECTORY")
          endif()
          """.replace('INCLUDE_DIRECTORY', include_dir)
          cmake.write_text(text.replace(anchor, anchor + '\n' + fallback, 1))
          PY
      - name: Probe CMake WebAssembly configuration
        shell: bash
        run: |
          set +e
          emcmake cmake -S azahar-src -B azahar-wasm-build -G Ninja             -DCMAKE_BUILD_TYPE=Release             -DENABLE_QT=OFF             -DENABLE_SDL2=OFF             -DENABLE_WEB_SERVICE=OFF             -DENABLE_DISCORD_PRESENCE=OFF             2>&1 | tee azahar-configure.log
          result=${PIPESTATUS[0]}
          printf 'CMake WebAssembly configuration exit code: %s\n' "$result" | tee azahar-result.txt
          if [ "$result" -eq 0 ]; then
            echo "Configure succeeded: next step is a real core build and web GPU/audio adapter."
          else
            echo "Configure failed: inspect diagnostics to identify required platform adaptations."
          fi
          exit "$result"
      - name: Compile 3DS core with Emscripten
        if: success()
        shell: bash
        timeout-minutes: 25
        run: |
          set +e
          echo "Available core targets:" | tee azahar-build.log
          ninja -C azahar-wasm-build -t targets all | grep -E 'citra_core|video_core' | head -30 | tee -a azahar-build.log
          cmake --build azahar-wasm-build --target citra_core --parallel 2 2>&1 | tee -a azahar-build.log
          result=${PIPESTATUS[0]}
          printf 'Core WebAssembly compilation exit code: %s\n' "$result" | tee azahar-build-result.txt
          exit "$result"
      - name: Upload port diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: azahar-wasm-feasibility
          path: |
            azahar-configure.log
            azahar-result.txt
            azahar-revision.txt
            azahar-submodules.txt
            azahar-build.log
            azahar-build-result.txt
          if-no-files-found: warn
