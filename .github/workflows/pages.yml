name: Deploy Web Emu
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build Web Emu mGBA SDK with speed control
        id: corebuild
        continue-on-error: true
        run: |
          set -euo pipefail
          git clone --depth 1 --branch v0.1.1 https://github.com/wasm-gaming/mGBA-wasm.git upstream || git clone --depth 1 https://github.com/wasm-gaming/mGBA-wasm.git upstream
          python3 scripts/patch-mgba-speed.py
          npm install --no-save --no-package-lock esbuild@0.25.12 @wasm-gaming/engine-specs@0.2.6
          mkdir -p vendor
          ./node_modules/.bin/esbuild upstream/src/mgba.sdk.ts --bundle --format=esm --platform=browser --target=es2022 --outfile=vendor/mgba-sdk.js
          curl -fLsS https://cdn.jsdelivr.net/npm/@wasm-gaming/mgba-wasm@0.1.1/dist/mgba/mgba.js -o vendor/mgba.js
          curl -fLsS https://cdn.jsdelivr.net/npm/@wasm-gaming/mgba-wasm@0.1.1/dist/mgba/mgba.wasm -o vendor/mgba.wasm
          test -s vendor/mgba-sdk.js && test -s vendor/mgba.wasm && test -s vendor/mgba.js
      - name: Build standalone offline index
        if: steps.corebuild.outcome == 'success'
        id: offline
        continue-on-error: true
        run: |
          set -euo pipefail
          python3 scripts/patch-mgba-offline.py
          ./node_modules/.bin/esbuild upstream/src/mgba.sdk.ts --bundle --format=iife --global-name=WebEmuMgba --platform=browser --target=es2022 --outfile=vendor/mgba-sdk-offline.js
          python3 scripts/build-offline.py
          test -s dist-offline/index.html
      - name: Upload offline index (double-clickable)
        if: steps.offline.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: Web-Emu-Offline
          path: dist-offline/index.html
          if-no-files-found: error
          compression-level: 0
      - name: Report offline build problems
        if: steps.corebuild.outcome == 'success' && steps.offline.outcome == 'failure'
        run: echo '::warning::Offline build failed. Check the offline build step logs.'
      - name: Remove incomplete core on build failure
        if: steps.corebuild.outcome == 'failure'
        run: |
          rm -rf vendor
          echo '::warning::Custom core failed to build; deploying the updated interface with CDN fallback. Check the preceding build logs.'
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
