name: Deploy Web Emu
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build Web Emu mGBA SDK with speed control
        id: corebuild
        continue-on-error: true
        run: |
          set -euo pipefail
          git clone --depth 1 --branch v0.1.1 https://github.com/wasm-gaming/mGBA-wasm.git upstream || git clone --depth 1 https://github.com/wasm-gaming/mGBA-wasm.git upstream
          python3 scripts/patch-mgba-speed.py
          npm install --no-save --no-package-lock esbuild@0.25.12 @wasm-gaming/engine-specs@0.2.6
          mkdir -p vendor
          ./node_modules/.bin/esbuild upstream/src/mgba.sdk.ts --bundle --format=esm --platform=browser --target=es2022 --outfile=vendor/mgba-sdk.js
          curl -fLsS https://cdn.jsdelivr.net/npm/@wasm-gaming/mgba-wasm@0.1.1/dist/mgba/mgba.js -o vendor/mgba.js
          curl -fLsS https://cdn.jsdelivr.net/npm/@wasm-gaming/mgba-wasm@0.1.1/dist/mgba/mgba.wasm -o vendor/mgba.wasm
          test -s vendor/mgba-sdk.js && test -s vendor/mgba.wasm && test -s vendor/mgba.js
      - name: Build standalone offline index
        if: steps.corebuild.outcome == 'success'
        id: offline
        continue-on-error: true
        run: |
          set -euo pipefail
          python3 scripts/patch-mgba-offline.py
          ./node_modules/.bin/esbuild upstream/src/mgba.sdk.ts --bundle --format=iife --global-name=WebEmuMgba --platform=browser --target=es2022 --outfile=vendor/mgba-sdk-offline.js
          python3 scripts/build-offline.py
          test -s dist-offline/index.html
      - name: Upload offline index (double-clickable)
        if: steps.offline.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: Web-Emu-Offline
          path: dist-offline/index.html
          if-no-files-found: error
          compression-level: 0
      - name: Report offline build problems
        if: steps.corebuild.outcome == 'success' && steps.offline.outcome == 'failure'
        run: echo '::warning::Offline build failed. Check the offline build step logs.'
      - name: Remove incomplete core on build failure
        if: steps.corebuild.outcome == 'failure'
        run: |
          rm -rf vendor
          echo '::warning::Custom core failed to build; deploying the updated interface with CDN fallback. Check the preceding build logs.'
      - name: Bundle Azahar and 27 classic / advanced console variants
        run: |
          set -euo pipefail
          python3 scripts/fetch-emulatorjs-azahar.py
          node --check cores/3ds.js
          node --check cores/retro.js
          node --check scripts/offline-server.cjs
      - name: Verify all console cores and browser entrypoints
        run: python3 scripts/verify-3ds-assets.py
      - name: Build complete offline Windows package
        id: offlinecomplete
        if: steps.corebuild.outcome == 'success'
        run: |
          set -euo pipefail
          python3 scripts/build-offline-folder.py
          package=dist-offline-complete/Web-Emu-Offline
          mkdir -p "$package/runtime"
          nodeversion=v22.16.0
          curl --fail --location --silent --show-error --retry 3 \
            "https://nodejs.org/dist/$nodeversion/node-$nodeversion-win-x64.zip" \
            -o /tmp/web-emu-node-windows.zip
          unzip -p /tmp/web-emu-node-windows.zip "node-$nodeversion-win-x64/node.exe" > "$package/runtime/node.exe"
          unzip -p /tmp/web-emu-node-windows.zip "node-$nodeversion-win-x64/LICENSE" > "$package/runtime/NODE-LICENSE.txt"
          test "$(stat -c '%s' "$package/runtime/node.exe")" -gt 1000000
          test -s "$package/runtime/NODE-LICENSE.txt"
          python3 scripts/verify-offline-folder.py "$package"
          # Launch package server and assert shared-memory isolation headers.
          WEB_EMU_NO_BROWSER=1 node "$package/scripts/offline-server.cjs" >/tmp/web-emu-offline-server.log 2>&1 &
          offline_pid=$!
          trap 'kill "$offline_pid" 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            if curl -fsSI http://127.0.0.1:8765/ >/tmp/web-emu-offline-headers; then break; fi
            sleep 1
          done
          grep -qi 'cross-origin-opener-policy: same-origin' /tmp/web-emu-offline-headers
          grep -qi 'cross-origin-embedder-policy: require-corp' /tmp/web-emu-offline-headers
          curl -fsSI http://127.0.0.1:8765/cores/3ds-player.html
          curl -fsSI http://127.0.0.1:8765/vendor/emulatorjs/data/cores/azahar-thread-wasm.data
          curl -fsSI http://127.0.0.1:8765/vendor/mgba.wasm
          echo 'Offline package and localhost cross-origin isolation smoke tests passed.'
      - name: Upload complete offline emulator for Windows
        if: steps.offlinecomplete.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: Web-Emu-Offline-All-Systems
          path: dist-offline-complete/Web-Emu-Offline/
          if-no-files-found: error
          compression-level: 6
      - name: Report offline Windows package build failure
        if: steps.offlinecomplete.outcome == 'failure'
        run: echo '::warning::Offline package build failed. See the Build complete offline Windows package step.'
      - name: Stage only playable website files
        run: |
          set -euo pipefail
          mkdir -p dist-pages
          cp index.html coi-serviceworker.js dist-pages/
          cp -r cores vendor licenses dist-pages/
          touch dist-pages/.nojekyll
          test -s dist-pages/cores/retro-player.html
          test -s dist-pages/cores/retro-systems.json
          test -s dist-pages/vendor/emulatorjs/data/cores/ppsspp-assets.zip
          test -s dist-pages/vendor/emulatorjs/data/cores/desmume-wasm.data
          test -s dist-pages/vendor/emulatorjs/data/cores/azahar-thread-wasm.data
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist-pages
      - id: deployment
        uses: actions/deploy-pages@v4
